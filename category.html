  inner.insertAdjacentHTML('beforeend','<a class="nav-search-link" href="index.html#products" aria-label="Search categories"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a><button class="nav-mobile-toggle" type="button" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>');
  const toggle=inner.querySelector('.nav-mobile-toggle');
  toggle.addEventListener('click',()=>{const open=links.classList.toggle('open');toggle.setAttribute('aria-expanded',open?'true':'false');});
  links.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>links.classList.remove('open')));
})();
</script>
<script>
  (() => {
    const slugMap = {
      Almonds: 'almonds',
      Cashews: 'cashews',
      Pistachios: 'pistachios',
      Walnuts: 'walnuts',
      'Pumpkin Seeds': 'pumpkin-seeds',
      'Sunflower Seeds': 'sunflower-seeds',
      'Chia Seeds': 'chia-seeds',
      'Flax Seeds': 'flax-seeds',
      'Sesame Seeds': 'sesame-seeds',
      'Dried Figs': 'dried-figs',
      'Dried Apricots': 'dried-apricots',
      Raisins: 'raisins',
      'Dried Cranberries': 'dried-cranberries',
      Prunes: 'prunes'
    };

    document.querySelectorAll('#productGrid .card').forEach(card => {
      const name = card.querySelector('h3')?.textContent.trim();
      const slug = slugMap[name];
      const link = card.querySelector('.enquire');
      if (!slug || !link) return;

      const category = new URLSearchParams(window.location.search).get('category') || '';
      link.href = `collection-detail.html?category=${encodeURIComponent(category)}&product=${encodeURIComponent(slug)}`;
      link.removeAttribute('target');
      link.removeAttribute('rel');
      link.innerHTML = 'Explore <span>→</span>';
      card.setAttribute('role', 'link');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `Explore ${name}`);
      card.addEventListener('click', event => {
        if (event.target.closest('a')) return;
        window.location.href = link.href;
      });
      card.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        window.location.href = link.href;
      });
    });
  })();
</script>
<script>document.querySelectorAll('.links,.nav-links').forEach(nav=>{if(!nav.querySelector('a[href="index.html#top"]')){const a=document.createElement('a');a.href='index.html#top';a.textContent='Home';nav.prepend(a)}});</script>
</html>
